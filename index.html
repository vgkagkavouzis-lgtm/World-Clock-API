<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get time with API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div id="toggle12hour">
            <button class="btn">12h</button>
        </div>
        <div id="toggleNightMode">
            <button class="btn">Day/Night Mode</button>
        </div>
        <!-- <button class="night-mode"></button> -->
    </nav>
    <section id="header">
        <div id="title-info">
            <h1>What time is it?</h1>
            <p>A web app to get any time you need!</p>
        </div>  
        <div id="local-time">
            <p>Local time · <span id="localZoneDisplay"></span></p>
            <h6 id="localTimeP">
                <span id="localTime"></span>
                <span id="localPeriod"></span>
                <span id="localOffset"></span>
            </h6>
        </div>
    </section>
    <section id="main-input-select-container">
        <div class="input">
            <form action="" id="main-input-form">
                <label for="">Find a city  </label> 
                <input type="text" class="inputBox" placeholder="Search city / country" autocomplete="off" id="searchBar">
                <div class="suggestions-box">
                    <!-- <div class="suggestions highlight">sdfsdfsdf</div> -->
                </div>    
            </form> 
            <div id="main-select-input">
                <label for="timeZoneSelect">Or choose a timezone</label>
                <select id="timeZoneSelect" class="inputBox">
                    <option value="Choose a time-zone">Choose a time-zone</option>
                </select>
            </div>
        </div>
    </section>
    <section id="middle-section">
        <section id="display-w-btn">
            <div class="container-display">
                <div id="displays">
                    <h3><span id="city">City</span>, <span id="country">Country</span></h3>
                    <div id="timeP">
                        <p id="time">Time</p>
                        <p id="period"> Period</p>
                    </div>
                    <div id="timezone-offset">
                        <p id="time-zone">Timezone</p>
                        <p>·</p>
                        <p id="offset">Offset</p>  
                    </div>
                    <button class="btn" id="add-location-btn">+ add location</button>
    
            </div>
            <div id="saved-zones">
    
                <h3>Saved locations</h3>
                <ul class="saved-zones-container">
                    <li data-timezone="">
                        <p class="saved-city-offset">
                            <span class="saved-city">City </span>
                            <span class="saved-offset"></span>
                        </p>
                        <p id="saved-time-period">
                            <span class="saved-time">Time </span>
                            <span class="saved-period"> </span>
                        </p>
                        <button class="removeBtn btn">x</button>
                    </li>
                </ul>
            </div>
    
        </section>
        <section id="time-converter">
            <h3>Time Converter</h3>
            <form action="" id="converter-form">
                <div id="converter-time-from-zone-container">
                    <label for="convertFromTimezone">From</label>
                        <select class="input-converter" id="convertFromTimezone" >
                            <option value="Timezone">Timezone</option>
                        </select>
                </div>
                <div id="converter-date-time-container">
                    <div id="converter-date-container">
                        <label for="convertFromDate">Date</label>
                        <input class="inputBox" id="convertFromDate" type="date" >
                    </div>
                    <div id="converter-date-container">
                        <label for="convertFromTime">Time</label>
                        <input class="inputBox" id="convertFromTime" type="time">
                    </div>
                </div>
                <div id="converter-time-to-zone-container">
                    <label for="convertToTimezone">To</label>
                        <select class="inputBox" id="convertToTimezone" >
                            <option value="Timezone">Timezone</option>
                        </select>
                </div>
            </form>
            <ul class="list" id="convertedList">
                <li>
                    <label for=""></label>
                    <p id="convertedData">
                        <span class='converted-time'>Time</span>
                        <span class='converted-date'>Date</span>
                        <span class="converted-timezone">Timezone</span>
                    </p>
                </li>
            </ul>
        </section>
    </section>
    <div class="assistant-display">
        <h3>Output</h3>
        <p>Search something</p>
    </div>
    <footer>V. Gkagkavouzis <span id="footerDate"></span> &copy;</footer>
    <script src="script.js"></script>
</body>
</html>
